<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Créer un compte</h2>
      <p>Rejoignez notre e-commerce</p>
    </div>

    <div *ngIf="messageSucces" class="success-message">
      {{ messageSucces }}
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (submit)="onRegister($event)" class="register-form">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="user.username"
          name="username"
          required
          placeholder="Choisissez un nom d'utilisateur"
          autocomplete="username">
      </div>

      <div class="form-group">
        <label for="email">Adresse email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="user.email"
          name="email"
          required
          placeholder="exemple@email.com"
          autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="user.password"
          name="password"
          required
          placeholder="Créez un mot de passe"
          autocomplete="new-password">
      </div>

      <button type="submit" [disabled]="loading" class="btn-register">
        {{ loading ? 'Création en cours...' : 'S\'inscrire' }}
      </button>
    </form>

    <div class="login-section">
      <p>Déjà inscrit ?</p>
      <a routerLink="/login" class="btn-login-link">
        Se connecter
      </a>
    </div>
  </div>
</div>
